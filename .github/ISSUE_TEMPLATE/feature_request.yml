name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what blocks you?
      placeholder: "I want to start dictation in a second language without changing settings."
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
