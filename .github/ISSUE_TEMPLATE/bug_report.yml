name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Codex Hark version
      description: Shown at the bottom right of the window.
      placeholder: "0.4.0"
    validations:
      required: true
  - type: input
    id: codex
    attributes:
      label: Codex Desktop version
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Windows version and microphone
      placeholder: "Windows 11 24H2, laptop microphone array"
  - type: input
    id: language
    attributes:
      label: Recognition languages enabled
      placeholder: "Bulgarian, English"
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Say 'Codex'. 2. Wait. 3. ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual behaviour
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Log lines
      description: Relevant lines from %APPDATA%\CodexHark\wakeword.log or the Activity screen. Remove personal data first.
