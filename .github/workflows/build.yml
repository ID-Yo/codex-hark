name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/cache@v4
        with:
          path: vosk-model-small-en-us-0.15
          key: vosk-model-small-en-us-0.15
      - name: Build
        shell: pwsh
        run: ./build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: CodexHark
          path: |
            dist/CodexHark.exe
            dist/SHA256SUMS.txt
      - name: Release notes
        shell: pwsh
        run: |
          $version = (build/venv/Scripts/python.exe -c "import wakeword; print(wakeword.__version__)").Trim()
          $changelog = Get-Content CHANGELOG.md -Raw
          $m = [regex]::Match($changelog, "(?s)## \[$([regex]::Escape($version))\][^\r\n]*\r?\n(.*?)(?=\r?\n## \[|\z)")
          if (-not $m.Success) { throw "CHANGELOG.md has no section for version $version" }
          $sum = (Get-Content dist/SHA256SUMS.txt).Split(" ")[0]
          $notes = @(
            $m.Groups[1].Value.Trim(), "",
            "SHA-256 of ``CodexHark.exe``: ``$sum``", "",
            "No installer: download ``CodexHark.exe``, check it against ``SHA256SUMS.txt`` and run it. The file is not signed, so Windows SmartScreen may warn on first run. Requirements and usage: [README](https://github.com/ID-Yo/codex-hark#install)."
          ) -join "`n"
          Set-Content release-notes.md $notes -Encoding utf8
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v') && github.repository == 'ID-Yo/codex-hark'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (build/venv/Scripts/python.exe -c "import wakeword; print(wakeword.__version__)").Trim()
          if ("v$version" -ne $env:GITHUB_REF_NAME) { throw "tag $env:GITHUB_REF_NAME does not match version $version" }
          gh release create $env:GITHUB_REF_NAME dist/CodexHark.exe dist/SHA256SUMS.txt --title "Codex Hark $env:GITHUB_REF_NAME" --notes-file release-notes.md --latest
