name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/cache@v4
        with:
          path: vosk-model-small-ru-0.22
          key: vosk-model-small-ru-0.22
      - name: Build
        shell: pwsh
        run: ./build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: CodexHark
          path: |
            dist/CodexHark.exe
            dist/SHA256SUMS.txt
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v') && github.repository == 'ID-Yo/codex-hark'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (build/venv/Scripts/python.exe -c "import wakeword; print(wakeword.__version__)").Trim()
          if ("v$version" -ne $env:GITHUB_REF_NAME) { throw "tag $env:GITHUB_REF_NAME does not match version $version" }
          gh release create $env:GITHUB_REF_NAME dist/CodexHark.exe dist/SHA256SUMS.txt --title "Codex Hark $env:GITHUB_REF_NAME" --generate-notes
