<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Codex Hark</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3M8 21h8"/></symbol>
<symbol id="home" viewBox="0 0 24 24"><path d="M4 11 12 4l8 7v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></symbol>
<symbol id="chat" viewBox="0 0 24 24"><path d="M5 5h14v10H9l-4 4z"/></symbol>
<symbol id="pen" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16zM14 6l4 4"/></symbol>
<symbol id="list" viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></symbol>
<symbol id="gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></symbol>
<symbol id="pause" viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></symbol>
<symbol id="play" viewBox="0 0 24 24"><path d="M7 5v14l11-7z"/></symbol>
<symbol id="codex" viewBox="0 0 24 24"><path d="m8 9-3 3 3 3M16 9l3 3-3 3M13 6l-2 12"/></symbol>
<symbol id="send" viewBox="0 0 24 24"><path d="M4 12 20 4l-6 16-3-7z"/></symbol>

<symbol id="folder" viewBox="0 0 24 24"><path d="M3 7h6l2 2h10v10H3z"/></symbol>
<symbol id="search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="m20 20-4-4"/></symbol>
<symbol id="ok" viewBox="0 0 24 24"><path d="m5 12 4 4 10-10"/></symbol>
<symbol id="warn" viewBox="0 0 24 24"><path d="M12 3 2 20h20zM12 10v4M12 17h.01"/></symbol>

</defs></svg>
<header class="topbar">
  <div class="brand"><img src="icon.png" alt="">Codex<span class="divider"></span><span class="brand-product">Hark</span></div>
  <nav class="main-nav" aria-label="Екрани">
    <button class="tab" data-screen="home"><svg class="icon"><use href="#home"/></svg>Начало</button>
    <button class="tab" data-screen="commands"><svg class="icon"><use href="#chat"/></svg>Гласови команди</button>
    <button class="tab" data-screen="mic"><svg class="icon"><use href="#mic"/></svg>Микрофон</button>
    <button class="tab" data-screen="activity"><svg class="icon"><use href="#list"/></svg>Дневник</button>
    <button class="tab" data-screen="settings"><svg class="icon"><use href="#gear"/></svg>Настройки</button>
  </nav>
  <span class="pill" id="top-state" role="status"><span class="dot"></span><span>…</span></span>
</header>
<main class="screen" id="screen" tabindex="-1"></main>
<footer class="statusbar"><span id="foot-state"><span class="dot"></span>…</span><span id="foot-version"></span></footer>
<script src="app.js"></script>
</body>
</html>
